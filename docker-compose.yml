# SIGPI — Docker Compose (development)
# Stack: Django 6.0 + PostgreSQL 16 + Redis 7 + Keycloak 26 + MinIO + Meilisearch 1.53

services:
  # ── Django backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigpi-backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=true
      - DJANGO_SECRET_KEY=dev-secret-change-in-production
      - POSTGRES_DB=sigpi
      - POSTGRES_USER=sigpi
      - POSTGRES_PASSWORD=sigpi
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Row-level security only applies when the runtime connects as the
      # least-privilege role, so enabling it here is a deliberate opt-in. The
      # role is created by migration 0010 (NOLOGIN) and made login-capable by
      # migration 0012; neither sets a password.
      #
      # Do NOT set POSTGRES_APP_USER in this service's environment by default:
      # settings prefer it, so EVERY manage.py command in the container would
      # then connect as sigpi_app, which has no DDL rights and cannot migrate.
      # Enable it per invocation, in this order:
      #
      #   1. migrate as the owner:
      #      docker compose run --rm -e POSTGRES_APP_USER= backend \
      #        python manage.py migrate
      #   2. give the role a password, as the owning user:
      #      docker compose exec db psql -U sigpi -d sigpi \
      #        -c "ALTER ROLE sigpi_app PASSWORD 'sigpi_app';"
      #   3. then run anything else with the switch on, e.g.
      #      docker compose run --rm -e POSTGRES_APP_USER=sigpi_app \
      #        -e POSTGRES_APP_PASSWORD=sigpi_app backend
      #
      # An init script mounted into `db` cannot create the role, because
      # /docker-entrypoint-initdb.d runs at cluster init, before any migration
      # has created it. CI verifies the role end to end in the
      # `backend-app-role-rls` job, so a developer does not need it locally.
      - REDIS_URL=redis://redis:6379/0
      - OIDC_RP_CLIENT_ID=sigpi-app
      - OIDC_RP_CLIENT_SECRET=dev-client-secret
      - OIDC_OP_AUTHORIZATION_ENDPOINT=http://keycloak:8080/realms/sigpi/protocol/openid-connect/auth
      - OIDC_OP_TOKEN_ENDPOINT=http://keycloak:8080/realms/sigpi/protocol/openid-connect/token
      - OIDC_OP_USER_ENDPOINT=http://keycloak:8080/realms/sigpi/protocol/openid-connect/userinfo
      - OIDC_OP_JWKS_ENDPOINT=http://keycloak:8080/realms/sigpi/protocol/openid-connect/certs
      - OIDC_OP_LOGOUT_ENDPOINT=http://keycloak:8080/realms/sigpi/protocol/openid-connect/logout
      - OIDC_RP_SIGN_ALGO=RS256
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=sigpi-documents
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_API_KEY=masterKey
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - sigpi-net

  # ── PostgreSQL 16 ───────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sigpi-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sigpi
      - POSTGRES_USER=sigpi
      - POSTGRES_PASSWORD=sigpi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigpi -d sigpi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sigpi-net

  # ── Redis 7 ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sigpi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - sigpi-net

  # ── Meilisearch 1.53 ────────────────────────────────────
  # Full-text search engine (RNF-014). Master key matches the
  # dev default baked into backend MEILISEARCH_API_KEY.
  meilisearch:
    image: getmeili/meilisearch:v1.53
    container_name: sigpi-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=masterKey
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sigpi-net

  # ── Keycloak 26 ─────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sigpi-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://kc-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak
      - KC_HOSTNAME=localhost
      - KC_HTTP_ENABLED=true
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
    depends_on:
      kc-db:
        condition: service_healthy
    networks:
      - sigpi-net

  # ── Keycloak DB ─────────────────────────────────────────
  kc-db:
    image: postgres:16-alpine
    container_name: sigpi-kc-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak
    volumes:
      - kcpgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sigpi-net

  # ── MinIO (S3-compatible object storage) ─────────────────
  # The official minio/minio image was removed from Docker Hub and
  # quay.io/minio/minio now requires authentication, so this pins the
  # frozen Bitnami legacy build. Env names and ports match upstream;
  # data lives at /bitnami/minio/data (Bitnami's convention).
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: sigpi-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_DEFAULT_BUCKETS=sigpi-documents
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sigpi-net

volumes:
  pgdata:
  redisdata:
  kcpgdata:
  miniodata:
  meilidata:

networks:
  sigpi-net:
    driver: bridge
