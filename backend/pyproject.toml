[project]
name = "sigpi-backend"
version = "0.1.0"
description = "SIGPI — Sistema de Información para la Gestión de Proyectos de Investigación"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "psycopg2-binary>=2.9",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "mozilla-django-oidc>=4.0",
    "django-allauth>=0.63",
    "django-ratelimit>=4.1",
    "django-fsm>=3.0",
    "django-filter>=24.0",
    "weasyprint>=62.0",
    "boto3>=1.34",
    "django-storages>=1.14",
    "meilisearch-python-sdk>=7.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "factory-boy>=3.3",
    "responses>=0.25",
    "pytest-env>=1.1",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.base"
pythonpath = ["backend"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
testpaths = ["backend"]
filterwarnings = [
    "ignore::UserWarning:django_fsm.*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
env = [
    "PYTEST_RUNNING=true",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
exclude = ["*/migrations/*"]
per-file-ignores = { "*/tests/*" = ["E501"] }

# NOTE: mypy is temporarily disabled due to an upstream crash with
# Python 3.14 on Windows (sqlite3 lock error). Use pyright instead.
# [tool.mypy]
# python_version = "3.12"
# strict = false
# ignore_missing_imports = true
# plugins = []

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
exclude = ["**/migrations", ".venv-wsl", "**/node_modules"]
venvPath = "."
venv = ".venv-wsl"
reportMissingImports = false
reportMissingTypeStubs = false
useLibraryCodeForTypes = true
