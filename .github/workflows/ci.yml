name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend — Lint, Type-check, Test
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sigpi
          POSTGRES_USER: sigpi
          POSTGRES_PASSWORD: sigpi
        options: >-
          --health-cmd "pg_isready -U sigpi -d sigpi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      POSTGRES_DB: sigpi
      POSTGRES_USER: sigpi
      POSTGRES_PASSWORD: sigpi
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      PYTEST_RUNNING: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment (backend/.venv-wsl)
        # backend/pyproject.toml sets venvPath="." and venv=".venv-wsl", and
        # pyright runs with cwd=backend, so the venv must live at
        # backend/.venv-wsl or pyright can never find it.
        run: |
          python -m venv backend/.venv-wsl
          source backend/.venv-wsl/bin/activate
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff linter
        run: |
          source backend/.venv-wsl/bin/activate
          cd backend && ruff check apps/

      - name: Check Ruff formatting
        run: |
          source backend/.venv-wsl/bin/activate
          cd backend && ruff format --check apps/

      # ADVISORY (not a gate): the backend currently carries ~1195 real type
      # errors across 129 files. Keep pyright's report visible without
      # failing the job. Remove continue-on-error once the count reaches
      # zero, and make the matching pre-commit hook blocking again.
      - name: Run Pyright type checker (advisory)
        continue-on-error: true
        run: |
          source backend/.venv-wsl/bin/activate
          cd backend && pyright

      - name: Run Django system checks
        run: |
          source backend/.venv-wsl/bin/activate
          cd backend && python manage.py check --deploy --fail-level ERROR
        env:
          DATABASE_URL: postgres://sigpi:sigpi@localhost:5432/sigpi
          DJANGO_DEBUG: false

      - name: Run backend tests with coverage
        # Run from the repo root, exactly like `make test-cov`: pyproject's
        # testpaths/pythonpath are resolved relative to the invocation
        # directory, so `cd backend && pytest -c pyproject.toml` collects zero
        # tests (testpaths "backend" resolves to backend/backend).
        run: |
          source backend/.venv-wsl/bin/activate
          pytest \
            -c backend/pyproject.toml \
            --cov=backend/apps \
            --cov-report=xml:backend/coverage.xml \
            --cov-report=term-missing:skip-covered \
            --tb=short \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────
  # Backend app-role RLS — least-privilege role, enforced end to end
  #
  # Protects against the runtime silently connecting as the table owner or a
  # superuser, which carries BYPASSRLS and makes every row-level-security
  # policy inert — the exact defect the role switch removes. It migrates as
  # the owner (migrations need DDL the app role does not have), sets the
  # sigpi_app password at runtime (never committed), then runs the
  # application connected as sigpi_app and asserts against real rows: no rows
  # without a tenant context, that tenant's rows with one. The existing
  # `backend` job is unchanged; this job only adds the app-role proof.
  # ─────────────────────────────────────────────────────────────
  backend-app-role-rls:
    name: Backend app-role RLS (least privilege)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sigpi
          POSTGRES_USER: sigpi
          POSTGRES_PASSWORD: sigpi
        options: >-
          --health-cmd "pg_isready -U sigpi -d sigpi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      POSTGRES_DB: sigpi
      POSTGRES_USER: sigpi
      POSTGRES_PASSWORD: sigpi
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create virtual environment (backend/.venv-wsl)
        run: |
          python -m venv backend/.venv-wsl
          source backend/.venv-wsl/bin/activate
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      # Owner credentials: migrations create the role (0010) and grant it,
      # which requires the owning superuser. The app vars stay unset here.
      - name: Migrate as the owning role
        run: |
          source backend/.venv-wsl/bin/activate
          cd backend && python manage.py migrate --noinput

      # The role is created NOLOGIN by 0010 and made LOGIN-capable by 0012,
      # but no migration carries a password. Set a throwaway one as the owner
      # so pg_hba's password method accepts sigpi_app.
      - name: Set the sigpi_app password (owner, runtime only)
        env:
          PGPASSWORD: sigpi
        run: |
          psql -h localhost -U sigpi -d sigpi -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE sigpi_app PASSWORD 'ci-app-role-password';"

      - name: Assert RLS end to end as sigpi_app
        env:
          POSTGRES_APP_USER: sigpi_app
          POSTGRES_APP_PASSWORD: ci-app-role-password
        run: |
          source backend/.venv-wsl/bin/activate
          cd backend && python manage.py verify_app_role_rls

  # ─────────────────────────────────────────────────────────────
  # Frontend — Lint, Type-check, Test
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript compiler check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --coverage --ci

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '20'
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
