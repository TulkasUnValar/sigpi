# SIGPI — Pre-commit hooks
# Run locally before each commit to enforce code quality.
# Install:  wsl -e bash -lc "cd /home/tulkasubuntu/01-sigpi && pre-commit install"
# Update:   wsl -e bash -lc "cd /home/tulkasubuntu/01-sigpi && pre-commit autoupdate"
# Run all:  wsl -e bash -lc "cd /home/tulkasubuntu/01-sigpi && pre-commit run --all-files"
#
# IMPORTANT: This repo lives in WSL. Pre-commit must run inside WSL,
#            not from Windows (PowerShell/Cmd), because WSL bash cannot
#            translate UNC paths like \\wsl.localhost\... and npx/cmd
#            shims crash inside WSL when invoked from Windows.

repos:
  # ── Environment guard ───────────────────────────────────────
  # Fail fast with a clear message if pre-commit runs from Windows
  # instead of WSL. WSL bash cannot translate UNC paths and npx/cmd
  # shims crash inside WSL when invoked from Windows.
  - repo: local
    hooks:
      - id: wsl-guard
        name: WSL environment guard
        entry: bash -lc 'if grep -qi microsoft /proc/version 2>/dev/null; then exit 0; else echo "ERROR - pre-commit must run inside WSL not Windows PowerShell/Cmd" && echo "Use a WSL terminal and run git commit from /home/tulkasubuntu/01-sigpi" && exit 1; fi'
        language: system
        always_run: true
        pass_filenames: false

  # ── Basic file hygiene ──────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']

  # ── Backend — Python (Ruff) ─────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        name: ruff linter
        args: ['--fix']
        files: ^backend/
      - id: ruff-format
        name: ruff formatter
        files: ^backend/

  # ── Backend — Python (Pyright) ──────────────────────────────
  # IMPORTANT: Must run inside WSL. The entry uses the WSL home
  # path directly because WSL bash cannot translate UNC paths
  # like \\wsl.localhost\... when invoked from Windows.
  - repo: local
    hooks:
      # ADVISORY (not a gate): pyright currently reports ~1195 real type
      # errors across 129 files, so it must not block commits. The pipeline
      # exits with tail's status (0) and `|| true` states that intent, while
      # `tail -3` prints just the summary line instead of dumping all 1195
      # errors on every backend commit. When the count reaches zero, drop
      # the pipe and `|| true` and turn this back into a gate.
      - id: pyright
        name: pyright type checker (advisory)
        entry: bash -lc 'cd /home/tulkasubuntu/01-sigpi/backend && .venv-312/bin/pyright 2>&1 | tail -3 || true'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
        verbose: true

  # ── Frontend — JavaScript / TypeScript (ESLint) ─────────────
  # IMPORTANT: Must run inside WSL. Uses the nvm Linux node binary
  # directly — npx shims resolve to Windows cmd.exe via WSL interop
  # and crash on UNC paths.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -lc 'cd /home/tulkasubuntu/01-sigpi/frontend && node node_modules/eslint/bin/eslint.js . --ext .ts,.tsx'
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^frontend/
        pass_filenames: false

  # ── Frontend — Formatting (Prettier) ────────────────────────
  # IMPORTANT: Must run inside WSL. The script uses the nvm Linux node
  # binary directly (npx shims resolve to Windows cmd.exe via WSL
  # interop and crash on UNC paths) and checks only the staged files.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash scripts/prettier-check.sh
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, markdown]
        files: ^frontend/
        pass_filenames: true
